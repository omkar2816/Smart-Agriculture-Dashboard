<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="agri-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5e3f" />
      <stop offset="100%" stop-color="#1b3d28" />
    </linearGradient>
    <linearGradient id="agri-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8e39f" />
      <stop offset="100%" stop-color="#f5f0dc" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with crisp edge -->
  <rect width="32" height="32" rx="7.5" fill="url(#agri-bg)" />
  <!-- Sprout & leaf contour -->
  <path d="M8 23c0-8 5.5-13 15-13.5-.4 9.5-5.5 14.5-13 14.2" fill="none" stroke="url(#agri-leaf)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Internal leaf vein -->
  <path d="M8 24.5c2.6-4.2 5.5-7 9.5-9.2" fill="none" stroke="#a4b771" stroke-width="1.8" stroke-linecap="round" />
  <!-- Vitality droplet bud -->
  <circle cx="21.5" cy="8.5" r="1.8" fill="#e9f3b5" />
</svg>
